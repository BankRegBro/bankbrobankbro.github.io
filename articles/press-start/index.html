function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.15 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0, className = "" }) {
  const [ref, visible] = useReveal();
  return (
    <div ref={ref} className={className} style={{ opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(24px)", transition: `opacity 900ms cubic-bezier(.2,.8,.2,1) ${delay}ms, transform 900ms cubic-bezier(.2,.8,.2,1) ${delay}ms` }}>
      {children}
    </div>
  );
}

function CountUp({ value, prefix = "", suffix = "", decimals = 0, duration = 1400 }) {
  const [ref, visible] = useReveal();
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!visible) return;
    const start = performance.now(); let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(value * eased);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [visible, value, duration]);
  return <span ref={ref}>{prefix}{n.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}</span>;
}

function FloatCalculator() {

          </div>
          <div>
            <label style={labelStyle}>Rewards share of yield</label>
            <div style={valueStyle}>{rewardShare}%</div>
            <input type="range" min={0} max={40} step={1} value={rewardShare} onChange={(e) => setRewardShare(parseInt(e.target.value))} />

              Sony's application for a national trust charter is under active review at the OCC. If Comptroller Gould approves it — and most expect he will — it will be the first time an entertainment conglomerate has been granted the powers to issue its own regulated digital dollar. The implications stretch well beyond gaming.

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "56px 28px 0", position: "relative", zIndex: 2 }}>
        <Reveal><Para dropCap>{`The filing arrived at the Office of the Comptroller of the Currency in late 2026, forty-seven pages of dense regulatory prose submitted under the name Sony Financial Trust, N.A. Applications for national trust charters are not ordinarily newsworthy. This one is different. Buried in section four, under the heading "Proposed Activities and Services," is a single sentence that has set the payments industry on edge: the applicant intends, upon approval of its charter and subject to certification by the Stablecoin Certification Commission under the GENIUS Act of 2026, to issue a fully reserved, US dollar-denominated payment stablecoin for use across Sony's global digital ecosystem.`}</Para></Reveal>
        <Reveal><Para>Sony is, in other words, applying to become a bank. Not a retail bank — it is not proposing to take deposits from the public or make loans in any conventional sense. A trust bank: a narrowly chartered institution holding assets on behalf of others, and in this case, holding the Treasury-bill reserves that would back a Sony-issued digital dollar intended to circulate across PlayStation Network, Sony Pictures, Sony Music, the Bravia connected-TV platform, and a constellation of affiliated digital services that together touch the daily lives of an estimated 700 million people worldwide.</Para></Reveal>
        <Reveal><Para>The OCC has not yet ruled. But Comptroller Gould has made little secret of his disposition. In a speech to the American Bankers Association in October, he described the GENIUS Act as "the most consequential piece of financial infrastructure legislation since Dodd-Frank" and argued that the OCC's mandate under the Act was to enable regulated innovation, not to protect incumbent business models. People familiar with the review process say a conditional approval is the most likely outcome, probably in the first quarter of 2027.</Para></Reveal>
        <PullQuote attribution="Senior executive, large card-issuing bank">We are modelling the approval as a near-certainty. The question we are spending our time on is not whether it happens. It is what we do when it does.</PullQuote>
        <SectionHead kicker="Part I">The ecosystem Sony has been quietly assembling</SectionHead>
        <Reveal><Para>Sony's ambitions in financial services have been visible to attentive observers for several years, assembled in pieces that only resolve into a coherent picture when set alongside the trust charter application. Consider what Sony actually controls. PlayStation Network has <SmallCaps>145 million</SmallCaps> active monthly users who collectively spend an estimated <SmallCaps>$26bn</SmallCaps> annually. Sony Pictures releases roughly 25 films per year. Sony Music is one of the three major labels. Alpha cameras command a significant share of the professional mirrorless market. Bravia televisions are the primary entertainment screen in tens of millions of households globally.</Para></Reveal>
      </article>

      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><EcosystemPanel /></div>

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "0 28px" }}>
        <Reveal><Para>Each of these businesses currently handles payments through fragmented, disconnected systems. A Sony-issued stablecoin would eliminate that friction entirely. The interchange saving at a conservative 2% on Sony's own-platform volume is estimated at roughly <SmallCaps>$520m</SmallCaps> annually. But the more compelling calculation is the float. At current T-bill yields of approximately <SmallCaps>4.3%</SmallCaps>, a circulating SEN Coin supply of $5bn would generate roughly <SmallCaps>$215m</SmallCaps> in annual reserve income that the Act permits Sony to retain.</Para></Reveal>
      </article>

      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><PaymentFlow /></div>
      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><FloatCalculator /></div>

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "0 28px" }}>
        <SectionHead kicker="Part II">What SEN Coin would actually look like</SectionHead>
        <Reveal><Para>The stablecoin would be backed one-to-one by short-duration US Treasury bills held in a segregated trust account, redeemable at par on demand. Consumers would load SEN Coin into a Sony wallet integrated across PlayStation, streaming apps, and broader digital services. The rewards architecture is expected to distribute SEN Credits to wallet holders as a fraction of the yield earned on their balances.</Para></Reveal>
      </article>

      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><PersonalYield /></div>

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "0 28px" }}>
        <PullQuote attribution="Thomas Osei, fintech investor">It's the most elegant monetisation of trust I've seen proposed in financial services in years. They're taking the consumer's own money, investing it in Treasuries, and giving back a slice of the return as entertainment rewards. The consumer feels rewarded. Sony keeps the rest of the yield.</PullQuote>
        <SectionHead kicker="Part III">The generational dimension</SectionHead>
        <Reveal><Para>The population Sony is targeting — 145 million monthly PlayStation Network users, skewed heavily toward the 18-to-35 cohort — is at precisely the stage of life when primary financial habits are formed. Sony is proposing to be present at the moment a young adult's entertainment spending migrates to a payment system native to the platform they already inhabit.</Para></Reveal>
      </article>

      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><GenerationalStrip /></div>

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "0 28px" }}>
        <SectionHead kicker="Part IV">The content flywheel</SectionHead>
        <Reveal><Para>SEN Coin adoption is accelerated by content incentives — exclusive release windows, day-one DLC access, discounted subscriptions — available only to wallet holders. The broader the adoption, the larger the float and reserve income. The reserve income funds more content investment and more generous rewards. Better content and rewards drive further adoption.</Para></Reveal>
      </article>

      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><Flywheel /></div>

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "0 28px" }}>
        <SectionHead kicker="Part V">The road to approval</SectionHead>
        <Reveal><Para>The OCC is expected to issue its ruling in the first quarter of 2027. If both the OCC approval and SCC certification proceed on the expected timeline, SEN Coin could be in the hands of consumers before the end of 2027. There are, by the OCC's own count, eleven such pre-applications currently under informal discussion with the agency's licensing staff. The queue forms to the right.</Para></Reveal>
      </article>

      <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0 28px" }}><Timeline /></div>

      <article style={{ maxWidth: 780, margin: "0 auto", padding: "0 28px" }}>
        <Reveal><div style={{ textAlign: "center", margin: "40px 0 20px", fontFamily: '"Playfair Display", Georgia, serif', fontSize: 22, color: GOLD, fontWeight: 900, letterSpacing: "0.4em" }}>§ § §</div></Reveal>

      ]
    }
  ];

  var statusEl = document.querySelector("#root-loading .tag");
  function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }

  function showError(title, detail) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML = '<div style="max-width:640px;margin:80px auto;padding:28px 32px;background:#F5EFE1;border-left:4px solid #9A2A2A;font-family:Georgia,serif;color:#1A1814;line-height:1.6;"><div style="font-family:\'Playfair Display\',Georgia,serif;font-size:22px;font-weight:800;color:#0F2A44;margin-bottom:10px;">Could not load The Ledger</div><div style="font-size:15px;margin-bottom:14px;">' + title + '</div><div style="font-family:Inconsolata,monospace;font-size:12px;color:#6B6354;background:#EBE2CE;padding:10px 12px;word-break:break-all;">' + detail + '</div><div style="font-size:13px;color:#6B6354;margin-top:14px;font-style:italic;">This page requires React, Recharts, and Babel loaded from a public CDN. Make sure you are viewing it via GitHub Pages (https://), not as a raw file.</div></div>';
  }

  function loadScript(urls, globalKey, name) {
    return new Promise(function (resolve, reject) {
      var attempt = 0;
      function tryNext() {
        if (attempt >= urls.length) { reject(new Error(name + ": all CDN sources failed")); return; }
        var url = urls[attempt++];
        var s = document.createElement("script");
        s.src = url; s.async = false; s.crossOrigin = "anonymous";
        s.onload = function () {
          if (typeof window[globalKey] !== "undefined") { resolve(); } else { tryNext(); }
        };
        s.onerror = function () { tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  function loadAll() {
    var chain = Promise.resolve();
    DEPS.forEach(function (d) {
      chain = chain.then(function () {
        setStatus("Loading " + d.name + "\u2026");
        return loadScript(d.urls, d.globalKey, d.name);
      });
    });
    return chain;
  }

  function compileAndRun() {
    setStatus("Compiling interactive figures\u2026");
    var srcEl = document.getElementById("article-jsx");
    if (!srcEl) throw new Error("Article source not found");
    var compiled = window.Babel.transform(srcEl.textContent, { presets: ["react"] }).code;
    (new Function(compiled))();
  }

  loadAll()
    .then(function () {
      try { compileAndRun(); }
      catch (err) {
        console.error(err);
        showError("The interactive figures failed to compile.", String(err && err.stack ? err.stack : err));
      }
    })
    .catch(function (err) {
      console.error(err);
      showError("A required library could not be loaded from the CDN.", String(err && err.message ? err.message : err));
    });

  setTimeout(function () {
    var loading = document.getElementById("root-loading");
    if (loading && loading.isConnected && typeof window.React === "undefined") {
      showError("The page has been loading for 20 seconds with no library available.", "Your browser could not reach unpkg.com or cdn.jsdelivr.net. Check your network, or ensure you are viewing via GitHub Pages (https://) rather than opening the file directly from disk.");
    }
  }, 20000);
})();
</script>
